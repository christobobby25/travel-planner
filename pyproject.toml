[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "travelplanner"
version = "0.1.0"
description = "Multi-agent travel planner on Bedrock AgentCore"
requires-python = ">=3.13"
dependencies = [
    "aws-opentelemetry-distro ~= 0.18.0",
    "bedrock-agentcore >= 1.24.0",
    "boto3 >= 1.43.0",
    "httpx >= 0.28.1",
    "langchain-aws >= 1.8.0",
    "langchain-core >= 1.6.6",
    "langchain-mcp-adapters >= 0.3.2",
    "langgraph >= 1.2.12",
    "mcp >= 1.30.0, < 2.0.0",
    "python-dotenv >= 1.2.4",
    "strands-agents >= 1.57.2",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
